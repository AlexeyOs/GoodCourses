services:
  db_postgre:
    image: postgres:16
    environment:
      POSTGRES_DB: goodcourses
      POSTGRES_USER: goodcourses
      POSTGRES_PASSWORD: ${DB_PASSWORD:-goodcourses-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodcourses -d goodcourses"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
    - pg16_data:/var/lib/postgresql/data
    networks:
    - eb

  tomcat_eb:
    build:
      context:  .
      dockerfile: docker/tomcat/Dockerfile
      args:
        BUILD_PROFILE: docker
    environment:
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY:-goodcourses-local-development-only}
      DB_PASSWORD: ${DB_PASSWORD:-goodcourses-local-only}
      APP_HOST: http://localhost:8888
    ports:
    - "127.0.0.1:8888:8080"
    restart: on-failure
    depends_on:
      db_postgre:
        condition: service_healthy
    networks:
    - eb

volumes:
  pg16_data:

networks:
  eb:
