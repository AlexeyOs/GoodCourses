application.production=true
app.host=http://localhost:8080
security.cookies.secure=false

db.driver=org.postgresql.Driver

#For docker
db.url=jdbc:postgresql://db_postgre:5432/goodcourses
db.username=goodcourses
db.password=${DB_PASSWORD:1234}

db.pool.initSize=5
db.pool.maxSize=10
hibernate.dialect=org.hibernate.dialect.PostgreSQL94Dialect


elasticsearch.home=/var/goodcourses/elastic-search-data

index.all.during.startup=false


email.sendTryCount=3
email.smtp.server=smtp.yandex.com
email.smtp.port=465
email.fromEmail=good.courses@yandex.ru
email.fromName=good.courses
email.smtp.username=${SMTP_USER_NAME}
email.smtp.password=${SMTP_PASSWORD}


executorService.threadCount=3

#For Docker
notification.config.path=/usr/local/tomcat/webapps/ROOT/WEB-INF/notifications/notifications.xml

# Local-only defaults. Production uses the heroku profile and environment secrets.
email.enabled=true

social.facebook.idClient=555888055261844
social.facebook.secret=${FACEBOOK_SECRET}
