application.production=true
app.host=${APP_HOST}
security.cookies.secure=true

db.driver=org.postgresql.Driver
#For docker
db.url=${DB_URL:jdbc:postgresql://localhost:5432/goodcourses}
#For develop
#db.url=jdbc:postgresql://localhost:5432/goodcourses
db.username=${DB_USERNAME:goodcourses}
db.password=${DB_PASSWORD:}

db.pool.initSize=${DB_POOL_INITIAL_SIZE:1}
db.pool.maxSize=${DB_POOL_MAX_SIZE:5}
hibernate.dialect=org.hibernate.dialect.PostgreSQL94Dialect

elasticsearch.home=${ELASTIC_SEARCH}

index.all.during.startup=false


email.sendTryCount=3
email.enabled=${SMTP_ENABLED:false}
email.smtp.server=${SMTP_HOST:localhost}
email.smtp.port=${SMTP_PORT:465}
email.fromEmail=${SMTP_FROM_EMAIL:good.courses@example.invalid}
email.fromName=${SMTP_FROM_NAME:GoodCourses}
email.smtp.username=${SMTP_USER_NAME}
email.smtp.password=${SMTP_PASSWORD}


executorService.threadCount=3

#For Docker
notification.config.path=classpath:notifications/notifications.xml

social.facebook.idClient=${FACEBOOK_CLIENT_ID:disabled}
social.facebook.secret=${FACEBOOK_SECRET:disabled}
